# slurm.conf generated for local non-root single workstation
# Tailored for: Intel Xeon W-2123 (1 Socket, 4 Cores, 2 Threads/Core) + NVIDIA T1000

# CONTROL MACHINE
SlurmctldHost=localhost

# CONTROL DAEMONS & PORTS
SlurmUser=8nt
SlurmdUser=8nt
SlurmctldPort=6817
SlurmdPort=6818

# DIRECTORY PATHS
SlurmctldPidFile=/home/8nt/sw/slurm-26.05.5/var/run/slurmctld.pid
SlurmdPidFile=/home/8nt/sw/slurm-26.05.5/var/run/slurmd.pid
SlurmSchedLogFile=/home/8nt/sw/slurm-26.05.5/var/log/slurm_sched.log
SlurmctldLogFile=/home/8nt/sw/slurm-26.05.5/var/log/slurmctld.log
SlurmdLogFile=/home/8nt/sw/slurm-26.05.5/var/log/slurmd.log
StateSaveLocation=/home/8nt/sw/slurm-26.05.5/var/slurmctld
SlurmdSpoolDir=/home/8nt/sw/slurm-26.05.5/var/slurmd

# SECURITY & AUTHENTICATION (MUNGE)
AuthType=auth/munge
AuthAltTypes=auth/none
# Pointer to your user-space MUNGE socket
AuthInfo=socket=/home/8nt/sw/munge/var/run/munge.local.s

# PROCESS TRACKING & REBOOT SETUP
# User-space requires pgid tracking instead of root-only cgroups
ProctrackType=proctrack/pgid
ReturnToService=1
SlurmctldTimeout=300
SlurmdTimeout=300
InactiveLimit=0
MinJobAge=300
KillWait=30
Waittime=0

# SCHEDULER & RESOURCE MANAGEMENT
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory

# MPI CONFIGURATION (For Open MPI 4.1.5)
# Open MPI 4.x natively handles pmix or pmi2
MpiDefault=pmix

# LOGGING & VERBOSITY
SlurmctldDebug=info
SlurmdDebug=info

# GRES CONFIGURATION (NVIDIA T1000 GPU)
GresTypes=gpu

# COMPUTE NODE DEFINITIONS (Workstation Hardware Breakdown)
# Sockets=1 CoresPerSocket=4 ThreadsPerCore=2 (Total 8 CPUs)
# RealMemory is set conservatively. Update if your workstation has more/less.
NodeName=localhost NodeAddr=127.0.0.1 Sockets=1 CoresPerSocket=4 ThreadsPerCore=2 RealMemory=15000 Gres=gpu:1 State=UNKNOWN

# PARTITION DEFINITIONS
PartitionName=workstation Nodes=localhost Default=YES MaxTime=INFINITE State=UP

